<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Calc API</title></head>
<body>
<script>
    const params = new URLSearchParams(window.location.search);
    const expr = params.get('calc');
    if (expr) {
        try {
            const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/');
            const result = eval(sanitized);
            document.body.textContent = JSON.stringify({ result: result });
        } catch (e) {
            document.body.textContent = JSON.stringify({ error: 'Invalid expression' });
        }
    } else {
        document.body.textContent = JSON.stringify({ error: 'No expression provided' });
    }
</script>
</body>
</html>
